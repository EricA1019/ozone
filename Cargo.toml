[package]
name = "ozone"
version = "0.4.8-alpha"
edition = "2021"
description = "⬡ Ozone — local AI stack operator for benchmarks, sweeps, profiles, and launch workflows"
license = "MIT"
repository = "https://github.com/EricA1019/ozone"
homepage = "https://github.com/EricA1019/ozone"
keywords = ["tui", "llm", "benchmark", "profiling", "ai"]
categories = ["command-line-utilities"]

[workspace]
members = [
    "apps/ozone-mcp",
    "crates/ozone-core",
    "crates/ozone-mcp",
]
exclude = [
    # Archived ozone+ crates. Keep outside RC workspace gates until
    # intentionally reactivated or removed.
    "crates/ozone-tui",
    "crates/ozone-engine",
    "crates/ozone-inference",
    # ozone-persist and ozone-memory are still needed by ozone-mcp's
    # legacy MCP tools (behind the "legacy-tools" feature flag).
    # Excluded from workspace builds but resolvable by path dependency.
    "crates/ozone-memory",
    "crates/ozone-persist",
]
resolver = "2"

[[bin]]
name = "ozone"
path = "src/main.rs"

[lib]
name = "ozone"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
crossterm = "0.28"
directories = "5"
libc = "0.2"
ozone-core = { path = "crates/ozone-core" }
ratatui = { version = "0.29", features = ["crossterm"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
ratatui-braille-bar = "0.2.2"

[dev-dependencies]

[features]
# Default builds include the RC user surface: launch, profiling, benchmarks,
# sweeps, analysis, and model management.
default = ["bench","sweep","analyze","profiling-ui","model-mgmt","eval"]
full = ["bench", "sweep", "analyze", "profiling-ui", "model-mgmt", "eval"]
bench = ["dep:rusqlite"]
sweep = ["bench"]
analyze = ["dep:rusqlite"]
profiling-ui = ["bench", "sweep", "analyze"]
eval = ["dep:rusqlite"]
model-mgmt = []

[profile.release]
strip = true
lto = "thin"

[profile.release-lite]
inherits = "release"
opt-level = "z"       # optimize for binary size
lto = "fat"           # full LTO — slower build, smaller output
codegen-units = 1     # single unit enables more cross-function optimization
strip = "symbols"     # strip all debug symbols
panic = "abort"       # no unwinding machinery (~10-20% size savings)
